repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1500]
      - id: check-merge-conflict
      - id: detect-private-key        # blocks commits with API keys
      - id: check-json
      - id: check-toml
      - id: no-commit-to-branch
        args: [--branch, main]         # force PRs, no direct push to main

  - repo: local
    hooks:
      - id: unit-tests
        name: Unit Tests
        entry: uv run pytest tests/unit/ -m unit -v --tb=short
        language: system
        pass_filenames: false
        stages: [pre-push]             # runs on git push, not every commit
